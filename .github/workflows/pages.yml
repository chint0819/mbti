name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/diagnosis-generator-app-3m5vun
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: テスト
        run: node tests/run-tests.js

      # 静的サイトなのでビルド不要。リポジトリの内容をそのまま gh-pages に公開する。
      # gh-pages ブランチの作成により GitHub Pages が自動で有効化される。
      - name: gh-pages ブランチへ公開
        run: git push origin HEAD:gh-pages --force
